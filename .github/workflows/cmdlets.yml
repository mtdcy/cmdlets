---
name: Check cmdlets cli

on:
  push:
    paths:
      - cmdlets.sh
      - .github/workflows/cmdlets.yml
    branches:
      - v1.0.x

  workflow_dispatch:

jobs:
  install:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cmdlets.sh
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:/usr/bin:/bin"

          ./cmdlets.sh bootstrap

          echo "$PATH" >> $GITHUB_PATH

      - name: Test cmdlets.sh
        shell: bash
        run: |
          set -ex
          export PATH="$HOME/.local/bin:/usr/bin:/bin"

          which cmdlets.sh
          pushd "$(which cmdlets.sh | xargs dirname)"

          # 1 - minigzip
          pkgvern=2.3.3
          names=(
            minigzip
            zlib/minigzip
            minigzip@$pkgvern
            zlib/minigzip@$pkgvern:minigzip
          )
          for name in "${names[@]}"; do
            cmdlets.sh install "$name"

            test -e prebuilts/bin/minigzip
            test -L minigzip
            cmdlets.sh ls | grep "minigzip - $pkgvern"

            cmdlets.sh rm minigzip
          done

          # 2 - bash
          names=(
            bash@3.2
            bash@4.4
          )
          for name in "${names[@]}"; do
            cmdlets.sh install "$name:bash"

            test -e "prebuilts/bin/$name"
            test -L "$name"
            test -L bash
            [ "$(readlink bash)" = "$name" ]
            bash --version | grep -w "${name#bash@}"

            cmdlets.sh rm "$name"
          done

      - name: Notify on failure
        if: ${{ failure() && vars.NOTIFY_WEBHOOK != '' }}
        shell: bash
        run: |-
          curl --version
          curl -vL ${{ vars.NOTIFY_WEBHOOK }} \
              -H 'Content-Type: application/json' \
              --data @<(cat <<EOF
              {
                "token": "${{ secrets.NOTIFY_TOKEN }}",
                "title": "${{ github.repository }} ${{ job.status }}",
                "text":  "$(git show --abbrev-commit -s ${{ github.sha }} | sed 's/$/\\n/g')"
              }
          EOF
              )
