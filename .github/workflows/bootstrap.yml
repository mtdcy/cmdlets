---
name: Build Windows bootstrap

on:
  push:
    paths:
      - bootstrap.windows.sh
      #- .github/workflows/bootstrap.yml
    branches:
      - main
    tags:
      - x86_64-pc-cygwin

  workflow_dispatch:

jobs:
  make-bootstrap-files:
    runs-on: ubuntu-latest
    # container: ${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/builder:cygwin64-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          set-safe-directory: true

      - name: Build
        id: build
        shell: bash
        run: |-
          set -ex

          mkdir -pv bootstrap/prebuilts

          bash bootstrap.windows.sh

          tar -C bootstrap --owner=root --group=root -czf bootstrap.windows.tar.gz .

          echo "rel=$(date +%y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Windows bootstrap files"
          tag_name: x86_64-pc-cygwin
          token: ${{ secrets.RELEASE_TOKEN }}
          files: |-
            bootstrap.windows.tar.gz

      - name: Notify on failure
        if: ${{ failure() && vars.NOTIFY_WEBHOOK != '' }}
        shell: bash
        run: |-
          curl --version
          curl -vL ${{ vars.NOTIFY_WEBHOOK }} \
              -H 'Content-Type: application/json' \
              --data @<(cat <<EOF
              {
                "token": "${{ secrets.NOTIFY_TOKEN }}",
                "title": "${{ github.repository }} ${{ job.status }}",
                "text":  "$(git show --abbrev-commit -s ${{ github.sha }} | sed 's/$/\\n/g')"
              }
          EOF
              )
